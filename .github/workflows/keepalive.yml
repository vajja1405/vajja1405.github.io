name: Keep the AI Space warm

# Free CPU Spaces sleep after ~48h without traffic; a light health check every 12h avoids a
# slow first answer for visitors. The site works without the Space either way.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://astra6-interview-my-work.hf.space/api/health || echo "Space not reachable (it may be starting)"
